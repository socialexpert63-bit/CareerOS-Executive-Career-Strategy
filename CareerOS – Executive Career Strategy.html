<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CareerOS – Executive Career Strategy</title>
<style>
:root{--navy:#14243A;--blue:#203B5B;--gold:#C39A57;--soft:#F5EBDD;--bg:#F7F8FA;--card:#fff;--text:#182435;--mute:#788392;--line:#E5E9EF;--ok:#31866B;--warn:#B7791F;--bad:#B4473F;--sh:rgba(20,36,58,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1522;--card:#16263B;--text:#EEF1F5;--mute:#9AA6B5;--line:#263A54;--soft:#2A2A2E;--sh:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1522;--card:#16263B;--text:#EEF1F5;--mute:#9AA6B5;--line:#263A54;--soft:#2A2A2E;--sh:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Manrope,Inter,system-ui,sans-serif;overflow-x:hidden}
#splash{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#203B5B,#0B1522 70%);z-index:99;display:grid;place-items:center;text-align:center;color:#fff;transition:opacity .6s,visibility .6s;perspective:700px}
#splash.out{opacity:0;visibility:hidden}
.cube{width:90px;height:90px;margin:0 auto 38px;transform-style:preserve-3d;animation:spin 6s linear infinite}
.cube i{position:absolute;inset:0;border:2px solid var(--gold);background:rgba(195,154,87,.14);box-shadow:0 0 24px rgba(195,154,87,.35) inset}
.cube i:nth-child(1){transform:translateZ(45px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(45px)}.cube i:nth-child(3){transform:rotateY(90deg) translateZ(45px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(45px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(45px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(45px)}
@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}
#splash h1{font-size:38px;margin:0;letter-spacing:-.02em}#splash h1 span{color:var(--gold)}#splash p{color:#B8C3D1;margin:6px 0 22px}
.ld{width:220px;height:4px;background:rgba(255,255,255,.15);border-radius:4px;margin:auto;overflow:hidden}.ld i{display:block;height:100%;width:0;background:var(--gold);transition:width 2.4s ease}
.app{display:flex;min-height:100vh}
nav{width:236px;background:linear-gradient(180deg,#14243A,#0E1B2E);color:#fff;padding:20px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;overflow-y:auto;perspective:600px}
nav h1{font-size:19px;margin:0 8px 18px}nav h1 span{color:var(--gold)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#B8C3D1;padding:9px 12px;border-radius:8px;font:inherit;cursor:pointer;margin-bottom:2px;transition:transform .25s,background .2s}
nav button:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateZ(14px) rotateY(-6deg)}
nav button.on{background:rgba(195,154,87,.2);color:var(--gold);font-weight:700}
main{flex:1;padding:26px 30px;max-width:1200px;min-width:0;perspective:1100px}
h2{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 10px 24px -14px var(--sh);transform-style:preserve-3d;transition:transform .2s ease-out,box-shadow .2s;will-change:transform}
.card:hover{box-shadow:0 26px 40px -18px var(--sh)}
.card>*{transform:translateZ(14px)}
.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.kpi b{font-size:30px;display:block;font-variant-numeric:tabular-nums}.kpi span{color:var(--mute);font-size:13px}
.hero{background:linear-gradient(135deg,#14243A,#203B5B);color:#fff;display:flex;gap:24px;align-items:center;flex-wrap:wrap;border:0}
.hero .sc{font-size:46px;font-weight:800;color:var(--gold)}
.btn{background:var(--gold);color:#14243A;border:0;border-radius:9px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;transition:.2s;box-shadow:0 4px 0 #9b7637}.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9b7637}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--text);box-shadow:none}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}.ok i{background:var(--ok)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--soft);color:var(--blue);margin:2px 4px 2px 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:var(--gold)}}
.ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0);position:relative;flex-shrink:0}.ring::after{content:attr(data-v);position:absolute;inset:6px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0}.cmp div{background:var(--card);padding:10px 12px;font-size:14px}.cmp .h{font-weight:700;background:var(--soft);color:#14243A}
.s-ok{color:var(--ok)}.s-p{color:var(--warn)}.s-m{color:var(--bad)}
.note{font-size:13px;color:var(--mute);border-left:3px solid var(--gold);padding-left:10px;margin:12px 0}
.kan{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:12px;overflow-x:auto}.col{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:10px;min-height:150px}.col h4{margin:0 0 8px;font-size:13px;color:var(--mute)}
.kc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;font-size:14px;box-shadow:0 6px 12px -8px var(--sh)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:10px;margin:0 6px 8px 0;cursor:pointer;transition:.2s;background:var(--card)}.chip.on{background:var(--gold);color:#14243A;border-color:var(--gold);transform:translateY(-2px)}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;margin:4px 0 10px}
textarea{min-height:90px}label{font-size:13px;color:var(--mute)}.err{color:var(--bad);font-size:13px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,30px);background:#14243A;color:#fff;padding:11px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
.view{animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(10px) rotateX(6deg)}}
details{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:700}
.wk{display:flex;gap:8px;align-items:flex-end;height:110px}.wk i{flex:1;background:linear-gradient(var(--gold),#9b7637);border-radius:6px 6px 0 0;height:0;transition:height .9s;box-shadow:4px 0 0 rgba(0,0,0,.12)}
.cv{background:#fff;color:#182435;padding:22px;border-radius:6px;box-shadow:0 20px 30px -14px var(--sh);min-height:260px;white-space:pre-wrap;font-size:13px;border-top:5px solid var(--gold)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 8px;border-top:1px solid var(--line);font-size:14px}tr.cl{cursor:pointer}tr.cl:hover{background:var(--soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:860px){.app{display:block;padding-bottom:64px}nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}nav h1{display:none}nav button{text-align:center;font-size:11px;padding:8px 10px;white-space:nowrap}main{padding:16px 12px}.g2,.g3,.g4{grid-template-columns:1fr}.cmp{grid-template-columns:1fr}}
</style></head><body>
<div id="splash"><div><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div><h1>Career<span>OS</span></h1><p>Make your experience count.</p><div class="ld"><i id="ldb"></i></div></div></div>
<div class="app"><nav id="nav"><h1>Career<span>OS</span></h1></nav><main id="main"></main></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)};
setTimeout(()=>$('#ldb').style.width='100%',50);setTimeout(()=>$('#splash').classList.add('out'),2700);
const OPPS=[
{id:1,t:'CTO – Banking & FinTech',c:'Emirates Digital Bank',l:'Dubai',p:'2 days ago',score:84,req:['10+ yrs tech leadership','Core banking modernisation','CBUAE exposure'],cmp:[['Seniority','C-level, 15+ yrs','18 yrs, Head of Technology','ok'],['Industry','Retail banking','Banking, 11 yrs','ok'],['Leadership','Team of 100+','Led 85 engineers','p'],['Achievements','Quantified transformation','Results not yet quantified','m'],['Work authorisation','UAE residency','UAE resident','ok']]},
{id:2,t:'Director of Technology Transformation',c:'Gulf Logistics Group',l:'Abu Dhabi',p:'5 days ago',score:76,req:['ERP migration','Change management','Budget AED 20M+'],cmp:[['Seniority','Director','Exceeds','ok'],['Industry','Logistics','Adjacent sector','p'],['Leadership','Cross-functional programmes','Led cross-functional teams','ok'],['Achievements','Migrations on budget','Budget size missing from CV','m'],['Work authorisation','UAE residency','UAE resident','ok']]},
{id:3,t:'VP of Digital Strategy',c:'Riyadh Capital Group',l:'Riyadh',p:'1 week ago',score:62,req:['Digital strategy','Saudi market','Arabic preferred'],cmp:[['Seniority','VP','Aligned','ok'],['Industry','Financial services','Banking, 11 yrs','ok'],['Leadership','Strategy function','Limited strategy ownership','p'],['Achievements','KSA delivery','No KSA evidence','m'],['Work authorisation','KSA permit','Needs verification','p']]},
{id:4,t:'Head of Enterprise Operations',c:'Al Noor Holdings',l:'Dubai',p:'1 week ago',score:55,req:['Operations at scale','P&L ownership','Process excellence'],cmp:[['Seniority','Head of department','Aligned','ok'],['Industry','Holding group','Different sector','p'],['Leadership','P&L','No P&L evidence','m'],['Achievements','Cost reduction','Efficiency gains unquantified','p'],['Work authorisation','UAE residency','UAE resident','ok']]}];
const STAGES=['Researching','Applied','Interview','Offer'];
let tracker=[{n:'Emirates Digital Bank – CTO',s:0},{n:'Gulf Logistics – Director',s:1},{n:'FinEdge – VP Technology',s:2},{n:'Al Noor – Head of Ops',s:0}];
const NAV=[['dash','Dashboard'],['assess','Career Assessment'],['pos','Positioning'],['match','Mandate Matching'],['cv','CV & LinkedIn'],['track','Job Tracker'],['out','Recruiter Outreach'],['int','Interview Prep'],['coach','Coaching'],['admin','Consultant View']];
$('#nav').insertAdjacentHTML('beforeend',NAV.map(([k,v])=>`<button data-k="${k}">${v}</button>`).join('')+'<button onclick="toggleTheme()">Toggle theme</button>');
$('#nav').onclick=e=>{if(e.target.dataset.k)go(e.target.dataset.k)};
function toggleTheme(){const r=document.documentElement,d=getComputedStyle(r).colorScheme==='dark';r.dataset.theme=d?'light':'dark'}
function go(k){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));$('#main').innerHTML='<div class="view">'+R[k]()+'</div>';count();bars();if(k==='track')dnd();if(k==='match')filter();if(k==='int')qshow();if(k==='cv')cvp();scrollTo(0,0)}
function count(){$$('[data-n]').forEach(el=>{const n=+el.dataset.n;let i=0;const s=()=>{i+=Math.ceil(n/25);el.textContent=Math.min(i,n);if(i<n)requestAnimationFrame(s)};s()})}
function bars(){setTimeout(()=>{$$('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%');$$('[data-h]').forEach(b=>b.style.height=b.dataset.h+'%')},40)}
const mn=$('#main');
mn.addEventListener('mousemove',e=>{const c=e.target.closest('.card');if(!c||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const r=c.getBoundingClientRect();c.style.transform=`rotateY(${((e.clientX-r.left)/r.width-.5)*7}deg) rotateX(${-((e.clientY-r.top)/r.height-.5)*7}deg) translateZ(6px)`});
mn.addEventListener('mouseout',e=>{const c=e.target.closest('.card');if(c)c.style.transform=''});
const kp=(l,n)=>`<div class="card kpi"><b data-n="${n}">0</b><span>${l}</span></div>`;
const bar=(l,v)=>`<div class="row"><small>${l}</small><small>${v}</small></div><div class="bar ok" style="margin:4px 0 12px"><i data-w="${v}"></i></div>`;
let W={s:0,d:{},sel:{}};
const WS=['Background','Expertise','Target roles','Target market','Challenges'];
const OPT=[['Technology Leadership','Banking','FinTech','Finance','Operations','Digital Transformation','Enterprise Sales','Consulting'],['CEO','CTO','CIO','CFO','COO','Director','VP','Head of Department'],['Dubai','Abu Dhabi','Sharjah','Riyadh','Jeddah','Doha'],['No interview invitations','CV not shortlisted','Unclear target roles','Approaching recruiters','Interview performance','Salary negotiation']];
const chips=i=>OPT[i-1].map(o=>`<span class="chip ${(W.sel[i]||[]).includes(o)?'on':''}" onclick="tg(${i},'${o}')">${o}</span>`).join('');
function tg(i,o){const a=W.sel[i]=W.sel[i]||[];a.includes(o)?a.splice(a.indexOf(o),1):a.push(o);wz()}
function wz(){if(W.s>4){$('#wz').innerHTML=`<div class="card hero"><div class="sc" id="done">…</div><div><b>Strategy generated</b><p>Based on ${W.sel[1]?.join(', ')||'your profile'}. Review it on the Positioning page.</p><button class="btn" onclick="go('pos')">View my positioning</button></div></div>`;setTimeout(()=>{$('#done').textContent='✓'},900);return}
const b=[`<label>Full name</label><input id="f1" value="${W.d.n||''}"><label>Current title</label><input id="f2" value="${W.d.t||''}"><label>Years of experience</label><input id="f3" type="number" value="${W.d.y||''}"><div class="err" id="er"></div>`,chips(1),chips(2),chips(3),chips(4)][W.s];
$('#wz').innerHTML=`<div class="card"><div class="row"><b>Step ${W.s+1}: ${WS[W.s]}</b><small>${W.s+1}/5</small></div><div class="bar" style="margin:8px 0 16px"><i style="width:${(W.s+1)*20}%"></i></div>${b}<button class="btn ghost" onclick="wn(-1)">Back</button> <button class="btn" onclick="wn(1)">${W.s==4?'Generate my career strategy':'Save and continue'}</button></div>`}
function wn(d){if(W.s===0&&d>0){const n=$('#f1').value.trim(),y=+$('#f3').value;if(!n||!(y>0&&y<50)){$('#er').textContent='Enter your name and years of experience (1–49).';return}W.d={n,t:$('#f2').value,y}}if(W.s+d<0)return;W.s+=d;wz()}
const CL=[['Sara Haddad','CFO, banking','CFO','Dubai',60,'Pending CV review'],['Omar Nasser','Director, Ops','COO','Riyadh',35,'Needs follow-up'],['Priya Menon','VP Technology','CTO','Abu Dhabi',80,'On track']];
const QS=['Tell me about a transformation you led and how you measured success.','How did you handle a major risk decision with limited data?','Describe how you built and developed a senior team.','How would you grow revenue in a new GCC market?'];let qi=0;
function qshow(){$('#q').textContent=QS[qi];$('#qn').textContent=`Question ${qi+1} of ${QS.length}`}
function qn(){qi=(qi+1)%QS.length;qshow();$('#fb').innerHTML=''}
function fb(){const t=$('#ans').value.trim();$('#fb').innerHTML=`<div class="card view"><b>Practice guidance (not a guaranteed evaluation)</b><p>${t.length<60?'Your answer is short. Add a specific Situation, your Action, and a Result you can evidence.':'Good structure. Make sure each result is accurate and, where possible, measurable.'}</p></div>`}
function gen(){const n=$('#rn').value||'there',c=$('#rc').value||'your firm',r=$('#rr').value||'senior technology';const m=`Hello ${n},\n\nI saw that ${c} is hiring for a ${r} mandate. I led a banking platform modernisation programme and would welcome a short conversation on whether my experience fits what you need.\n\nKind regards,\nAhmed`;const o=$('#ot');o.value='';let i=0;clearInterval(gen.t);gen.t=setInterval(()=>{o.value=m.slice(0,++i);if(i>=m.length)clearInterval(gen.t)},12)}
function cvp(){$('#pv').textContent=`${$('#cn').value}\n\nPROFILE\n${$('#cs').value}`}
let bk={};
const R={
dash:()=>`<h2>Good morning, Ahmed.</h2><p class="sub">UAE & GCC · Search status: Active</p><div class="card hero"><div><div class="sc"><span data-n="86">0</span>/100</div><small>Career positioning score</small></div><div style="flex:1;min-width:220px"><b>Your next recommended action</b><p style="color:#C9D2DE;margin:6px 0 12px">Your experience closely matches a Senior Technology Transformation Director role. Your CV could better demonstrate measurable transformation outcomes.</p><button class="btn" onclick="go('pos')">Improve my positioning</button></div></div><div class="grid g4">${kp('Opportunities matched',12)+kp('Applications in progress',8)+kp('Interviews scheduled',2)+kp('Follow-ups pending',3)}</div><div class="grid g2"><div class="card"><b>Weekly activity</b><div class="wk" style="margin-top:14px">${[40,65,30,80,55,20,70].map(h=>`<i data-h="${h}"></i>`).join('')}</div></div><div class="card"><b>Application funnel</b><div style="margin-top:10px">${bar('Researched',100)+bar('Applied',66)+bar('Replies',42)+bar('Interviews',17)}</div></div></div>`,
assess:()=>{setTimeout(wz,0);return`<h2>Let’s understand your experience.</h2><p class="sub">Five short steps.</p><div id="wz"></div>`},
pos:()=>`<h2>Your experience. Clearly positioned.</h2><p class="sub">${W.d.n?W.d.n+' · ':''}Technology leader · Banking & FinTech · Target: CTO / Director, UAE & GCC</p><div class="grid g3"><div class="card">${bar('Strengths',90)}</div><div class="card">${bar('Leadership evidence',78)}</div><div class="card">${bar('Measurable results',58)}</div></div><div class="card"><b>Achievement rewrite</b><div class="cmp"><div class="h">Original</div><div class="h">Suggested</div><div>Responsible for managing technology teams.</div><div id="sug">Led a cross-functional engineering team responsible for platform modernisation, improving delivery performance and efficiency.</div></div><div class="note">Drafts only. Verify every statement and add only numbers you can evidence. CareerOS never invents achievements.</div><textarea id="ed"></textarea><button class="btn" onclick="$('#ed').value=$('#sug').textContent;toast('Copied for editing')">Edit suggestion</button> <button class="btn ghost" onclick="toast('Marked as verified')">I verified this</button></div><div class="card"><details open><summary>Roles worth targeting</summary>CTO and Director of Technology Transformation, banking and FinTech.</details><details><summary>Evidence to strengthen</summary>Budget size, team size, quantified programme outcomes.</details></div><button class="btn" onclick="go('match')">Continue to matching</button>`,
match:()=>`<h2>Find opportunities that match your experience.</h2><p class="sub">Verified experience compared with real requirements.</p><div class="card row"><select id="fl" onchange="filter()" style="max-width:220px"><option value="">All locations</option><option>Dubai</option><option>Abu Dhabi</option><option>Riyadh</option></select><label>Minimum match <b id="mv">0</b>% <input type="range" id="mn2" min="0" max="90" value="0" oninput="filter()"></label></div><div id="list"></div><div id="detail"></div>`,
cv:()=>`<h2>Make your experience impossible to misunderstand.</h2><p class="sub">Edit on the left, preview updates live.</p><div class="grid g2"><div class="card"><label>Name</label><input id="cn" value="Ahmed Khan" oninput="cvp()"><label>Professional summary</label><textarea id="cs" oninput="cvp()">Technology executive with 18 years in banking and FinTech, leading platform modernisation across UAE markets.</textarea><b>AI suggestions</b><div class="note">Replace "responsible for" with what you delivered.<br>Add team size and budget if accurate.<br>Remove roles older than 15 years unless relevant.</div><button class="btn" onclick="toast('Version saved')">Save version</button> <button class="btn ghost" onclick="toast('PDF export (demo)')">Export PDF</button></div><div><div class="cv" id="pv"></div><div class="card" style="margin-top:14px"><b>LinkedIn headline</b><p>Technology executive | Banking & FinTech transformation | UAE & GCC</p></div></div></div>`,
track:()=>`<h2>Stay organised. Follow through.</h2><p class="sub">Drag cards, or tap to advance. Fewer, better-targeted applications.</p><div class="kan" id="kan"></div>`,
out:()=>`<h2>Start the right conversation.</h2><p class="sub">Relationship-driven outreach, never mass messaging.</p><div class="grid g2"><div class="card"><label>Recruiter name</label><input id="rn"><label>Company</label><input id="rc"><label>Target role</label><input id="rr"><button class="btn" onclick="gen()">Generate draft</button></div><div class="card"><label>Message (editable)</label><textarea id="ot" style="min-height:220px"></textarea><button class="btn" onclick="navigator.clipboard?.writeText($('#ot').value);toast('Copied')">Copy</button> <button class="btn ghost" onclick="toast('Template saved')">Save template</button></div></div>`,
int:()=>`<h2>Walk into every interview prepared.</h2><p class="sub">Practice guidance, not a guaranteed evaluation.</p><div class="grid g2"><div class="card"><small id="qn"></small><p id="q" style="font-size:18px;font-weight:700"></p><label>Answer (Situation, Task, Action, Result)</label><textarea id="ans"></textarea><button class="btn" onclick="fb()">Get feedback</button> <button class="btn ghost" onclick="qn()">Next question</button><div id="fb"></div></div><div class="card"><b>Preparation checklist</b>${['Research the company','Understand the mandate','Prepare leadership examples','Prepare questions','Practise closing statement'].map(x=>`<p><label style="color:var(--text)"><input type="checkbox" style="width:auto" onchange="toast('Progress updated')"> ${x}</label></p>`).join('')}</div></div>`,
coach:()=>`<h2>Get expert guidance on your next move.</h2><p class="sub">Pricing: contact Job Search Mastery UAE for details.</p><div class="card"><b>1. Choose a consultation</b><div style="margin-top:10px">${['Career Strategy','Executive CV Review','LinkedIn Positioning','Interview Preparation'].map(s=>`<span class="chip ${bk.s===s?'on':''}" onclick="bk.s='${s}';go('coach')">${s}</span>`).join('')}</div><b>2. Pick a time</b><div style="margin-top:10px">${['Mon 10:00','Tue 14:00','Wed 11:00','Thu 16:00'].map(s=>`<span class="chip ${bk.t===s?'on':''}" onclick="bk.t='${s}';go('coach')">${s}</span>`).join('')}</div><button class="btn" onclick="bk.s&&bk.t?(toast('Request sent: '+bk.s+', '+bk.t),bk={}):toast('Select a consultation and a time')">Submit booking request</button></div>`,
admin:()=>`<h2>Consultant workspace.</h2><p class="sub">Private view for No Cap LLC / Job Search Mastery UAE (sample data).</p><div class="grid g4">${kp('Active clients',24)+kp('New assessments',5)+kp('CV reviews pending',4)+kp('Follow-ups due',7)}</div><div class="card"><table><tr><th>Client</th><th>Position</th><th>Target</th><th>Progress</th></tr>${CL.map((c,i)=>`<tr class="cl" onclick="$('#cd').innerHTML='<b>${c[0]}</b><br>Market: ${c[3]} · Status: ${c[5]}<div class=note>Week plan: Assessment, CV, Opportunity research, Outreach, Interview prep.</div>'"><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}, ${c[3]}</td><td><div class="bar"><i data-w="${c[4]}"></i></div></td></tr>`).join('')}</table></div><div class="card" id="cd">Select a client to open their workspace.</div>`};
function filter(){const l=$('#fl').value,m=+$('#mn2').value;$('#mv').textContent=m;$('#list').innerHTML=OPPS.filter(o=>(!l||o.l===l)&&o.score>=m).map(o=>`<div class="card row" style="cursor:pointer" onclick="detail(${o.id})"><div><b>${o.t}</b><br><small style="color:var(--mute)">${o.c} · ${o.l} · ${o.p}</small><div>${o.req.map(r=>`<span class="tag">${r}</span>`).join('')}</div></div><div class="ring" style="--p:${o.score}" data-v="${o.score}%"></div></div>`).join('')||'<div class="card">No roles match. Lower the minimum match.</div>'}
function detail(id){const o=OPPS.find(x=>x.id===id),ic={ok:'Strong',p:'Partial',m:'Missing evidence'};$('#detail').innerHTML=`<div class="card view"><b>${o.t}: match analysis</b><div class="cmp"><div class="h">What the employer needs</div><div class="h">What you demonstrate</div>${o.cmp.map(r=>`<div><b>${r[0]}</b><br>${r[1]}</div><div>${r[2]}<br><small class="s-${r[3]}">${ic[r[3]]}</small></div>`).join('')}</div><div class="note">The ${o.score}% score weighs the five factors above. It is guidance, not a prediction of an interview or offer.</div><button class="btn" onclick="toast('Saved')">Save</button> <button class="btn ghost" onclick="go('cv')">Tailor my CV</button> <button class="btn ghost" onclick="go('out')">Prepare message</button> <button class="btn ghost" onclick="tracker.push({n:'${o.c} – ${o.t.split(' –')[0]}',s:0});toast('Added to tracker')">Add to tracker</button></div>`;$('#detail').scrollIntoView({behavior:'smooth'})}
function dnd(){$('#kan').innerHTML=STAGES.map((s,i)=>`<div class="col" data-s="${i}"><h4>${s} (${tracker.filter(t=>t.s===i).length})</h4>${tracker.map((t,j)=>t.s===i?`<div class="kc" draggable="true" data-j="${j}">${t.n}</div>`:'').join('')}</div>`).join('');let d;$$('.kc').forEach(c=>{c.ondragstart=()=>d=+c.dataset.j;c.onclick=()=>{const t=tracker[+c.dataset.j];t.s=(t.s+1)%4;toast('Moved to '+STAGES[t.s]);dnd()}});$$('.col').forEach(c=>{c.ondragover=e=>e.preventDefault();c.ondrop=()=>{tracker[d].s=+c.dataset.s;toast('Moved to '+STAGES[+c.dataset.s]);dnd()}})}
go('dash');
</script></body></html>
